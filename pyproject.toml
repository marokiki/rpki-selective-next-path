[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-next-path"
version = "0.1.0"
description = "Deterministic selective Next-path RPKI migration model"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["selective_next_path*"]
exclude = ["reference*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
